# Renders the "Sponsor" button on the repository page.
#
# `custom` points the button at any URL, which is why GitHub Sponsors is not set
# up here at all — Buy Me a Coffee serves both audiences from one account, with
# none of the Stripe Connect / identity / tax-form onboarding Sponsors requires.
#
# It is also the only option that works for the demo page's audience: sponsoring
# through GitHub requires the *sponsor* to hold a GitHub account, and the corpus
# is 88% psychology, philosophy, HCI and cognitive science. BMC takes card
# payments with no registration.
#
# Kept in sync with SUPPORT_URL in demo/frontend/src/App.tsx so the repo button
# and the demo footer never point different places.

custom: ["https://buymeacoffee.com/zaious"]
